[project]
name = "kaptain"
version = "0.1.0"
description = "Kaptain — the out-of-process decider the Kubernetes scheduler plugin calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "prometheus-client==0.21.0",
]

[project.optional-dependencies]
# Only the drs strategy imports these, lazily; the image installs them for every policy so
# that all arms run the same decider image (reproduction-drs/ECARTS-DRS.md, E17).
drs = [
    "torch==2.5.1",
    "numpy==2.1.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false

