[project]
name = "kaptain"
version = "0.1.0"
description = "Kaptain — the out-of-process decider the Kubernetes scheduler plugin calls"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "prometheus-client==0.21.0",
]

[dependency-groups]
dev = ["pytest==8.3.3", "httpx==0.27.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
