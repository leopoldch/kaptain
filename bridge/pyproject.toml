[project]
name = "kaptain"
version = "0.1.0"
description = "Kaptain — the out-of-process decider the Kubernetes scheduler plugin calls"
requires-python = "==3.12.*"  # torch 2.5.1 has no wheel for 3.13
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "prometheus-client==0.21.0",
    "torch==2.5.1",
    "numpy==2.1.3",
]

[tool.uv]
package = false


# The CPU build only: the CUDA one is gigabytes the decider never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
