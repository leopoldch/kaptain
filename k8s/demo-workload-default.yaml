# Baseline arm, to run on its own. Never at the same time as another arm: pods scheduled
# concurrently by different schedulers compete for the same nodes, and the comparison then
# measures the race rather than the policy.
apiVersion: v1
kind: Pod
metadata:
  name: demo-default
  labels: { app: demo, integration: default }
spec:
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "250m", memory: "64Mi" }
