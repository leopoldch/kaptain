# Extender arm, to run on its own. The baseline is in demo-workload-default.yaml and the
# plugin arm in demo-workload-plugin.yaml: one arm at a time, otherwise the arms race for
# the same nodes and the comparison measures the race.
apiVersion: v1
kind: Pod
metadata:
  name: demo-ours
  labels: { app: demo, integration: extender }
spec:
  schedulerName: ml-scheduler
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "250m", memory: "64Mi" }
