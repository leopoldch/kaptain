apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-extender
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: scheduler-extender }
  template:
    metadata:
      labels: { app: scheduler-extender }
    spec:
      containers:
        - name: extender
          image: kaptain-extender:dev   # local image loaded into kind
          imagePullPolicy: IfNotPresent
          env:
            - name: STRATEGY            # single place to switch the active strategy
              value: "dummy-random"     # or "spread-cpu", etc.
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet: { path: /healthz, port: 8888 }
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-extender
  namespace: kube-system
spec:
  selector: { app: scheduler-extender }
  ports:
    - port: 8888
      targetPort: 8888
