# Demo pod for the plugin path. Run one arm at a time: pods scheduled concurrently by
# different schedulers compete for the same nodes and confound the comparison.
apiVersion: v1
kind: Pod
metadata:
  name: demo-plugin
  labels: { app: demo, integration: plugin }
spec:
  schedulerName: kaptain-scheduler
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "250m", memory: "64Mi" }
