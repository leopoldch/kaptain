apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-scheduler-config
  namespace: kube-system
data:
  config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    # Disabled: otherwise this scheduler waits on the "kube-scheduler" lock
    # already held by the cluster's built-in scheduler and stays idle.
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: ml-scheduler
        plugins:
          score:
            disabled:
              - name: "*"
    extenders:
      - urlPrefix: "http://scheduler-extender.kube-system.svc.cluster.local:8888"
        # No filterVerb on purpose. Our /filter handler is a pass-through -- admissibility
        # stays Kubernetes' job in both integrations -- but declaring the verb made
        # kube-scheduler pay a second HTTP round trip per pod for an answer that never
        # changes anything. Measured: 610 /filter calls for 610 /prioritize calls, roughly
        # half the transport cost of this path, spent on nothing.
        # The endpoint stays implemented, for an experiment that would genuinely filter.
        prioritizeVerb: "prioritize"
        weight: 5
        enableHTTPS: false
        nodeCacheCapable: false
        ignorable: false
