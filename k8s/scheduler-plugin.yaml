# The in-scheduler integration: a kube-scheduler built with the KaptainScore plugin,
# named "kaptain-scheduler". The default Kubernetes scheduler and the extender-based
# "ml-scheduler" stay untouched, so the three paths can be compared.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaptain-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: kaptain-scheduler }
  template:
    metadata:
      labels: { app: kaptain-scheduler }
    spec:
      serviceAccountName: kaptain-scheduler
      containers:
        - name: kube-scheduler
          image: kaptain-scheduler:dev   # local image loaded into kind
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/kubernetes/config.yaml
            # Let Prometheus scrape the plugin metrics without a token.
            - --authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics
            - --v=3
          env:
            # MUST match STRATEGY in extender.yaml: comparing the two paths under
            # different strategies measures the policy, not the integration. The default is
            # the control arm, which is also what the integration-cost pilot uses.
            - name: KAPTAIN_STRATEGY
              value: "dummy-random"
            - name: KAPTAIN_SEED          # seeded draw, so dummy-random is reproducible
              value: "7"
            # Uncomment to send decisions to an out-of-process ML/RL/LLM decider.
            # - name: KAPTAIN_DECIDER_URL
            #   value: "http://kaptain-decider.kube-system.svc.cluster.local:8889/decide"
            - name: KAPTAIN_DECIDER_TIMEOUT
              value: "50ms"
            # Measured node usage, needed by least-used. Collectors: off, metrics-api
            # (requires metrics-server), kubelet (reserved, not implemented). An unknown or
            # unimplemented collector is refused at startup rather than silently ignored.
            - name: KAPTAIN_TELEMETRY
              value: "off"
            - name: KAPTAIN_TELEMETRY_REFRESH
              value: "2s"
            - name: RUN_ID
              value: "unset"
            - name: POLICY_VERSION
              value: "unset"
          ports:
            - name: metrics
              containerPort: 10259
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: 10259, scheme: HTTPS }
      volumes:
        - name: config
          configMap:
            name: kaptain-scheduler-config
---
apiVersion: v1
kind: Service
metadata:
  name: kaptain-scheduler
  namespace: kube-system
  labels: { app: kaptain-scheduler }
spec:
  selector: { app: kaptain-scheduler }
  ports:
    - name: metrics
      port: 10259
      targetPort: 10259
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaptain-scheduler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaptain-scheduler-as-kube-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: kaptain-scheduler
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaptain-scheduler-as-volume-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: kaptain-scheduler
    namespace: kube-system
---
# The scheduler ClusterRole does not cover metrics.k8s.io, which the telemetry source reads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaptain-scheduler-metrics-reader
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaptain-scheduler-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kaptain-scheduler-metrics-reader
subjects:
  - kind: ServiceAccount
    name: kaptain-scheduler
    namespace: kube-system
---
# Read the auth configmap (silences startup warnings).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kaptain-scheduler-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: kaptain-scheduler
    namespace: kube-system
