# The out-of-process decider the plugin calls when KAPTAIN_DECIDER_URL is set.
#
# No ServiceAccount and no RBAC: this process never reads the Kubernetes API. The plugin
# builds the snapshot from the scheduler cache and sends it; everything the policy needs is
# in the request body. That is the whole difference with the extender this replaced.
# The one exception is drs, which queries the DRS monitors (k8s/drs-monitor.yaml) over the
# VPN, as DRS's decision maker did: still no Kubernetes API, but not a pure function.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaptain-decider
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: kaptain-decider }
  template:
    metadata:
      labels: { app: kaptain-decider }
    spec:
      # Kaptain must not run on a node it schedules onto. The kubelet summary reports the
      # whole node's usage, so a scheduler or a decider sitting on a worker inflates that
      # worker's measured load, and least-used would then avoid a node for no reason but
      # Kaptain being there. The control plane is tainted in kind and excluded from the
      # candidates, which is exactly where this belongs.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: decider
          image: kaptain-decider:dev   # local image loaded into kind
          imagePullPolicy: IfNotPresent
          env:
            # MUST match KAPTAIN_STRATEGY in scheduler-plugin.yaml: the plugin refuses to
            # start, and refuses the decision, if the two disagree.
            - name: STRATEGY            # drs | dummy-random | largest-cpu-capacity | least-allocated | least-used | round-robin
              value: "dummy-random"
            # Read by the drs strategy only: its monitors, normalisation and hyper-parameters.
            - name: DRS_CONFIG
              value: /etc/kaptain-drs/config.json
          volumeMounts:
            - name: drs-config
              mountPath: /etc/kaptain-drs
              readOnly: true
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet: { path: /healthz, port: 8888 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      volumes:
        # Optional: every other policy starts without it.
        - name: drs-config
          configMap:
            name: kaptain-drs-config
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: kaptain-decider
  namespace: kube-system
spec:
  selector: { app: kaptain-decider }
  ports:
    - port: 8888
      targetPort: 8888
