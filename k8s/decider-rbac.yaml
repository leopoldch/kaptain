# The decider lists pods and reads their logs, nothing else: the kaptain strategies learn
# runtimes from the experiment pods, count the unfinished ones, and read the CPU time each one
# reports (bridge/strategies/kaptain.py).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaptain-decider
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kaptain-decider-list-pods
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kaptain-decider-list-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kaptain-decider-list-pods
subjects:
  - kind: ServiceAccount
    name: kaptain-decider
    namespace: kube-system
