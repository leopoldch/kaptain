name = "calib-drsdisk-8g-pve1"
description = "Calibration: one drsdisk8g pod (8.2 GB, the authors' size) at a time on leopold-pve-worker-1, 500m, three times (DRS Fig. 5-7)"
source = "Jian et al. 2024 (DRS), section 5.2, Figures 5-7; reproduction-drs/SYNTHESE-DRS.md, essai 12"
seed = 7
count = 3
# Pinned with nodeName: profiles the workload, never a placement result.
node = "leopold-pve-worker-1"
# Duration unknown on the resized VMs (16.4 GB per pod): 600 s leaves room for 27 MB/s.
# If two pods overlap, raise interval_s and run again.
timeout_s = 3600
hold_s = 0

[arrival]
process = "fixed"
interval_s = 600

[mix]
drsdisk8g = 1

[resources]
cpu_millis = [500, 500]
