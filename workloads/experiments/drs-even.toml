name = "drs-even"
description = "DRS even workload: cpu/memory/disk at 1:1:1, one pod every 20 s"
source = "Jian et al. 2024 (DRS), section 5.2, Even workload"
seed = 7
count = 60
timeout_s = 3600

[arrival]
process = "fixed"
interval_s = 20

[mix]
cpu = 1
memory = 1
disk = 1

[resources]
cpu_millis = [200, 500]
