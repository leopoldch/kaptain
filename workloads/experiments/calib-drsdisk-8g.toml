name = "calib-drsdisk-8g"
description = "Calibration: one drsdisk8g pod (8.2 GB, the authors' size) at a time on the --node node, 500m, three times (DRS Fig. 5-7)"
source = "Jian et al. 2024 (DRS), section 5.2, Figures 5-7"
seed = 7
count = 3
# Run with --node: pinned with nodeName, it profiles the workload and is never a placement result.
calibration = true
# Wider than one pod's run on our slowest worker, so each pod runs alone. If two pods overlap,
# raise interval_s and run again.
timeout_s = 3600
hold_s = 0

[arrival]
process = "fixed"
interval_s = 600

[mix]
drsdisk8g = 1

[resources]
cpu_millis = [500, 500]
