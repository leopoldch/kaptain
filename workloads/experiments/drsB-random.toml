name = "drsB-random"
description = "DRS reproduction, variant B (stress-ng, PR #28): cpu/memory/disk at 1:1:1, inter-arrival N(20 s, 1 s)"
source = "Jian et al. 2024 (DRS), section 5.2, Random workload; stress-ng as in PR #28; reproduction-drs/ECARTS-DRS.md (E28)"
seed = 7
count = 300
timeout_s = 9000

[arrival]
process = "normal"
mean_s = 20
stddev_s = 1

[mix]
cpu = 1
memory = 1
disk = 1

[resources]
cpu_millis = [200, 500]
