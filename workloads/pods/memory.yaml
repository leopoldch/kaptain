# Memory stressor, stress-ng as in Raith et al. 2024.
apiVersion: v1
kind: Pod
metadata:
  name: memory
  labels:
    kaptain.io/workload: memory
spec:
  schedulerName: kaptain-scheduler
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: work
      image: ghcr.io/colinianking/stress-ng@sha256:cf90385beccc3de5c04839ff86b378c133fa02ec5cf36c0573a5ab5be652edf6
      command: [stress-ng, --vm, "1", --vm-bytes, 128M, --vm-ops, "2000000", --temp-path, /tmp, --metrics-brief]
      resources:
        requests: {cpu: 500m, memory: 256Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
