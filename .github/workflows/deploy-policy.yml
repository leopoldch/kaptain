name: Deploy policy

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Decision policy to deploy
        required: true
        default: dummy-random
        type: choice
        options:
          - dummy-random
          - largest-cpu-capacity
          - least-allocated
          - least-used

permissions:
  contents: read

concurrency:
  group: kaptain-cluster
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'leopoldch/kaptain' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, kaptain-cluster]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate script syntax
        shell: bash
        run: bash -n deploy-policy.sh

      - name: Deploy and verify policy
        shell: bash
        env:
          DEPLOY_STRATEGY: ${{ inputs.strategy }}
        run: bash deploy-policy.sh "$DEPLOY_STRATEGY"
