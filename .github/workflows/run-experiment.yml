name: Run experiment

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment from workloads/experiments/
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - decision-cost
          - packing-random
          - web
          - drs-even
          - drs-random
          - drs-cpu
      strategy:
        description: Policy to deploy first (current keeps the deployed one)
        required: true
        default: current
        type: choice
        options:
          - current
          - dummy-random
          - largest-cpu-capacity
          - least-allocated
          - least-used
  push:
    branches: [feat/experiment-runner]
    paths:
      - .github/workflows/run-experiment.yml
      - workloads/**

permissions:
  contents: read

concurrency:
  group: kaptain-cluster
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.repository == 'leopoldch/kaptain' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/feat/experiment-runner'))
    runs-on: [self-hosted, linux, x64, kaptain-cluster]
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Deploy policy
        if: github.event_name == 'workflow_dispatch' && inputs.strategy != 'current'
        shell: bash
        env:
          DEPLOY_STRATEGY: ${{ inputs.strategy }}
        run: bash deploy-policy.sh "$DEPLOY_STRATEGY"

      - name: Run experiment
        shell: bash
        env:
          EXPERIMENT: ${{ inputs.experiment || 'smoke' }}
          KEXP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 workloads/kexp.py run "$EXPERIMENT" --out results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experiment-${{ inputs.experiment || 'smoke' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90
