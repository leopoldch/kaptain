name: Cluster diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaptain-cluster
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'leopoldch/kaptain' && github.ref == 'refs/heads/mainline'
    runs-on: [self-hosted, linux, x64, kaptain-cluster]
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Docker and Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          k=(docker exec kaptain-k3s kubectl --server=https://10.50.0.1:6443)
          {
            echo '# Cluster diagnostic'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_NAME"
            echo
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          trap 'echo '\''```'\'' >> "$GITHUB_STEP_SUMMARY"' EXIT
          {
            hostname
            id
            docker version --format 'Docker server: {{.Server.Version}}'
            docker inspect --format 'K3s container running: {{.State.Running}}' kaptain-k3s
            "${k[@]}" get --raw=/readyz
            echo
            "${k[@]}" wait --for=condition=Ready node --all --timeout=30s
            "${k[@]}" get nodes -o wide
            "${k[@]}" -n kube-system get deployments,pods \
              -l 'app in (kaptain-decider,kaptain-scheduler)' -o wide
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
