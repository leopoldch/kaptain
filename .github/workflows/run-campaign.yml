name: Run campaign

# Every experiment, policy and seed listed. Each policy is deployed afresh for each experiment:
# Kaptain starts from scratch. The policies that learn first train on other seeds, then every
# policy runs the evaluated seeds, Kaptain frozen; Kaptain's policies do it `replicates` times,
# independent trainings (KAPTAIN_SEED 1, 2, ...), with validate_every set frozen every that many
# training runs on the validation seeds 500 and 501. default-scheduler leaves the pods to
# Kubernetes, pin-<node> to Kubernetes on that node only (each task measured on each node). One
# report per run in the summary, then a table per experiment of the evaluated runs (ktable.py),
# all the raw files in one artifact. nodes runs them on other machines than the labelled ones.
# With train_on, a policy is deployed once for all the experiments: it trains on train_on's
# experiments in turn, then is evaluated on each experiment, also those it never trained on. With
# eval_nodes, the policies train on nodes and are evaluated on each set of eval_nodes instead,
# with nodes they never trained on. Those runs are cold: each one starts from the runtime
# estimates the training left, so no run knows a new node from the run before; a table per set.
# With priors, each cold run is done once per prior, under the same deployment: none, or the
# runtime a task starts from on a node where it never ran (copy, llm, llm-placebo, placebo).

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: Experiments from workloads/experiments/, separated by spaces
        required: true
        default: even-5s even-10s
        type: string
      strategies:
        description: Policies, separated by spaces; kaptain-b<beta>-l<lambda>[-llm|-placebo][-ef] sets its weights, Phi and earliest-finish prior, kaptain[-b<beta>]-pod[-alone][-ef] rewards each decision for its own pod, -alone without the pods it slows, -hide with one node hidden at each training run and given a noisy prior; default-scheduler; pin-<node>
        required: true
        default: kaptain-pod-alone earliest-finish shortest-estimate least-allocated default-scheduler
        type: string
      seeds:
        description: Seeds evaluated, separated by spaces (each one gives other pods and arrival times)
        required: true
        default: 7 8 9 10 11
        type: string
      train_runs:
        description: Training runs before them, for the policies that learn (seeds 1000, 1001, ...)
        required: true
        default: "10"
        type: string
      replicates:
        description: Independent trainings of each Kaptain policy (KAPTAIN_SEED 1, 2, ...)
        required: true
        default: "3"
        type: string
      validate_every:
        description: Kaptain frozen on the validation seeds 500 501 every that many training runs (0 for never)
        required: true
        default: "0"
        type: string
      train_on:
        description: Experiments the training runs take in turn, separated by spaces; one deployment is then evaluated on every experiment (empty to train each experiment on itself)
        required: false
        default: ""
        type: string
      nodes:
        description: Experiment nodes, separated by spaces, instead of those labelled kaptain.io/experiment-node=true (empty for those)
        required: false
        default: ""
        type: string
      eval_nodes:
        description: Node sets the policies are evaluated on instead of nodes, where they still train; nodes separated by spaces, sets by semicolons (empty to evaluate on nodes)
        required: false
        default: ""
        type: string
      priors:
        description: With eval_nodes, what a task starts from on a node where it never ran, each cold run done once per prior; none, copy, llm, llm-placebo, placebo, separated by spaces
        required: false
        default: none
        type: string
      prior_model:
        description: The LLM of the llm and llm-placebo priors; an OpenAI model, or an Anthropic one when its name starts with claude- (empty for gpt-6.1-terra)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: kaptain-cluster
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.repository == 'leopoldch/kaptain' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, kaptain-cluster]
    timeout-minutes: 4320
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run campaign
        shell: bash
        env:
          EXPERIMENTS: ${{ inputs.experiments }}
          STRATEGIES: ${{ inputs.strategies }}
          SEEDS: ${{ inputs.seeds }}
          TRAIN_RUNS: ${{ inputs.train_runs }}
          REPLICATES: ${{ inputs.replicates }}
          VALIDATE_EVERY: ${{ inputs.validate_every }}
          TRAIN_ON: ${{ inputs.train_on }}
          KEXP_NODES: ${{ inputs.nodes }}  # every kexp call of this step: the runs and their cleanup
          EVAL_NODES: ${{ inputs.eval_nodes }}  # the evaluation on each of these sets instead of KEXP_NODES
          PRIORS: ${{ inputs.priors }}  # of the cold runs
          PRIOR_MODEL: ${{ inputs.prior_model }}  # of the llm priors
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # only the -llm policies and the llm prior use it
          ANT_API_KEY: ${{ secrets.ANT_API_KEY }}  # only the llm prior with an Anthropic model
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash workloads/campaign.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90
