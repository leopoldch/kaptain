name: Run campaign

# Every experiment, policy and seed listed. Each policy is deployed afresh for each experiment:
# Kaptain starts from scratch. The policies that learn first train on other seeds, then every
# policy runs the evaluated seeds, Kaptain frozen; Kaptain's policies do it `replicates` times,
# independent trainings (KAPTAIN_SEED 1, 2, ...), with validate_every set frozen every that many
# training runs on the validation seeds 500 and 501. default-scheduler leaves the pods to
# Kubernetes, pin-<node> to Kubernetes on that node only (each task measured on each node). One
# report per run in the summary, then a table per experiment of the evaluated runs (ktable.py),
# all the raw files in one artifact.

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: Experiments from workloads/experiments/, separated by spaces
        required: true
        default: even-5s even-10s
        type: string
      strategies:
        description: Policies, separated by spaces; kaptain-b<beta>-l<lambda>[-llm] sets its weights and Phi; default-scheduler; pin-<node>
        required: true
        default: kaptain earliest-finish shortest-estimate least-allocated default-scheduler
        type: string
      seeds:
        description: Seeds evaluated, separated by spaces (each one gives other pods and arrival times)
        required: true
        default: 7 8 9 10 11
        type: string
      train_runs:
        description: Training runs before them, for the policies that learn (seeds 1000, 1001, ...)
        required: true
        default: "10"
        type: string
      replicates:
        description: Independent trainings of each Kaptain policy (KAPTAIN_SEED 1, 2, ...)
        required: true
        default: "3"
        type: string
      validate_every:
        description: Kaptain frozen on the validation seeds 500 501 every that many training runs (0 for never)
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: kaptain-cluster
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.repository == 'leopoldch/kaptain' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, kaptain-cluster]
    timeout-minutes: 4320
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run campaign
        shell: bash
        env:
          EXPERIMENTS: ${{ inputs.experiments }}
          STRATEGIES: ${{ inputs.strategies }}
          SEEDS: ${{ inputs.seeds }}
          TRAIN_RUNS: ${{ inputs.train_runs }}
          REPLICATES: ${{ inputs.replicates }}
          VALIDATE_EVERY: ${{ inputs.validate_every }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # only the -llm policies use it
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          read -ra experiments <<< "$EXPERIMENTS"
          read -ra strategies <<< "$STRATEGIES"
          read -ra seeds <<< "$SEEDS"
          for experiment in "${experiments[@]}"; do
            [[ -f workloads/experiments/$experiment.toml && $experiment =~ ^[a-z0-9-]+$ ]] || { echo "unknown experiment: $experiment"; exit 1; }
          done
          for strategy in "${strategies[@]}"; do
            [[ $strategy =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "bad strategy: $strategy"; exit 1; }
          done
          for seed in "${seeds[@]}"; do
            [[ $seed =~ ^[0-9]+$ ]] || { echo "bad seed: $seed"; exit 1; }
          done
          [[ $TRAIN_RUNS =~ ^[0-9]+$ ]] || { echo "bad train_runs: $TRAIN_RUNS"; exit 1; }
          [[ $REPLICATES =~ ^[1-9][0-9]*$ ]] || { echo "bad replicates: $REPLICATES"; exit 1; }
          [[ $VALIDATE_EVERY =~ ^[0-9]+$ ]] || { echo "bad validate_every: $VALIDATE_EVERY"; exit 1; }

          failed=0
          runs=()
          for experiment in "${experiments[@]}"; do
            for strategy in "${strategies[@]}"; do
              # Kubernetes alone needs no deployment; only Kaptain's policies are trained several times.
              scheduler='' pin='' deploy=1 replicates=('')
              case $strategy in
                default-scheduler) scheduler=default-scheduler deploy=0 ;;
                pin-*) pin=${strategy#pin-} deploy=0 ;;
                kaptain*) replicates=($(seq 1 "$REPLICATES")) ;;
              esac
              for replicate in "${replicates[@]}"; do
                # Before the deployment: its own check refuses while pods of a killed run remain.
                python3 workloads/kexp.py cleanup
                if (( deploy )) && ! KAPTAIN_SEED=${replicate:-7} bash deploy-policy.sh "$strategy"; then
                  runs+=("| $experiment | $strategy | ${replicate:-–} | all | all | deploy failed |")
                  failed=1
                  continue
                fi
                # Policies that learn train first, on other seeds; then every policy is evaluated,
                # Kaptain frozen. The others have nothing to learn. Kaptain's checkpoints along
                # the training run frozen on the validation seeds: whether it converges.
                plan=()
                if [[ $strategy == kaptain* || $strategy == shortest-estimate || $strategy == earliest-finish ]]; then
                  for ((i = 1; i <= TRAIN_RUNS; i++)); do
                    plan+=("train $((999 + i))")
                    if [[ $strategy == kaptain* ]] && (( VALIDATE_EVERY && i % VALIDATE_EVERY == 0 )); then
                      plan+=("valid 500 $i" "valid 501 $i")
                    fi
                  done
                fi
                for seed in "${seeds[@]}"; do plan+=("eval $seed"); done
                for step in "${plan[@]}"; do
                  read -r phase seed checkpoint <<< "$step"
                  python3 workloads/kexp.py cleanup
                  # A namespace name takes no dot: kaptain-b0.5 becomes kaptain-b0-5 there.
                  if KEXP_PHASE=$phase KEXP_SEED=$seed KEXP_REPLICATE=$replicate KEXP_SCHEDULER=$scheduler KEXP_PIN=$pin \
                      KEXP_CHECKPOINT=$checkpoint \
                      KEXP_RUN_ID=$RUN-${strategy//./-}${replicate:+-r$replicate}-$phase-s$seed${checkpoint:+-c$checkpoint} \
                      python3 workloads/kexp.py run "$experiment" --out results; then
                    runs+=("| $experiment | $strategy | ${replicate:-–} | $phase${checkpoint:+ $checkpoint} | $seed | complete |")
                  else
                    runs+=("| $experiment | $strategy | ${replicate:-–} | $phase${checkpoint:+ $checkpoint} | $seed | failed |")
                    failed=1
                  fi
                done
              done
            done
          done

          {
            echo "# Campaign"
            echo
            echo '| Experiment | Policy | Training | Phase | Seed | Run |'
            echo '| --- | --- | --- | --- | --- | --- |'
            printf '%s\n' "${runs[@]}"
            echo
            [[ -d results ]] && (cd workloads && python3 ktable.py ../results --reference least-allocated)
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: ignore
          retention-days: 90
